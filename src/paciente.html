<title>Área do Paciente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Área do paciente da nutricionista Ana Carolina Pereira: ficha de saúde, exames e acompanhamento.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: faixa musgo no topo; depois de entrar, menu das seções à esquerda (no celular vira barra fixa embaixo, como app) e a página da seção ao lado. Antes de entrar, um cartão central de acesso. Tema único claro, todo branco. */
:root{
  --bg:#ffffff;
  --ink:#2c2f26;
  --muted:#727667;
  --line:#e0e2d7;
  --soft:#f5f6f0;
  --brand:#5d6e35;
  --on-brand:#ffffff;
  --on-brand-line:rgba(255,255,255,.6);
  --accent:#56672f;
  --accent-soft:#eef1e3;
  --cta:#5d6e35;
  --cta-hover:#4a5928;
  --wa:#1f9a52;
  --wa-hover:#18833f;
  --error:#d4492f;
  --error-soft:#fcefeb;
  --off:#c0c3b4;
  --font-ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-brand:"Fraunces",Georgia,"Times New Roman",serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

/* Topo */
.topo{background:var(--brand);color:var(--on-brand)}
.topo-in{max-width:1120px;margin:0 auto;padding-block:16px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.logo-mark{width:42px;height:42px;border-radius:12px;border:2px solid currentColor;display:grid;place-items:center}
.logo-txt{display:grid;line-height:1.15;min-width:0}
.logo-nome{font-family:var(--font-brand);font-size:22px;font-weight:600;letter-spacing:-.01em}
.logo-sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.topo-user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--on-brand);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:14px}
.topo-nome{font-weight:700}
.topo-sair{background:none;border:1.5px solid var(--on-brand-line);color:var(--on-brand);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
.topo-sair:hover{background:var(--on-brand-line)}
@media (max-width:560px){.topo-nome{display:none}.logo-nome{font-size:19px}}

/* Estrutura */
.wrap{max-width:1120px;margin:0 auto;padding-block:32px 64px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.portal{display:grid;gap:32px}
@media (min-width:900px){.portal{grid-template-columns:232px minmax(0,1fr);gap:56px}}
.pagina{min-width:0;display:grid;gap:32px;align-content:start;max-width:780px}

/* Menu: lateral no computador, barra embaixo no celular */
.menu{display:grid;gap:4px;align-content:start}
.menu-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.menu-item:hover{background:var(--soft);color:var(--ink)}
.menu-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:800}
.menu-ico{display:grid;place-items:center;position:relative}
.ponto{position:absolute;top:-2px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--error);border:2px solid var(--bg)}
.l-curto{display:none}
.menu-ajuda{margin-top:20px;padding:16px;border-radius:12px;background:var(--soft);font-size:14px;display:grid;gap:4px}
.menu-ajuda strong{font-size:15px}
.menu-ajuda a{color:var(--accent);font-weight:700}
.ajuda-m{display:none;margin:0;padding:16px 18px;border-radius:12px;background:var(--soft);font-size:15px}
.ajuda-m a,.sigilo a{color:var(--accent);font-weight:700}
@media (min-width:900px){.menu{position:sticky;top:24px}}
@media (max-width:899px){
  .menu{position:fixed;z-index:30;left:0;right:0;bottom:0;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--bg);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));padding-left:max(4px, env(safe-area-inset-left, 0px));padding-right:max(4px, env(safe-area-inset-right, 0px))}
  .menu-item{flex-direction:column;gap:2px;padding:4px 2px;font-size:11.5px;line-height:1.2;text-align:center}
  .menu-item:hover{background:none}
  .menu-item[aria-current="page"]{background:none}
  .menu-item .menu-ico{padding:4px 16px;border-radius:999px}
  .menu-item[aria-current="page"] .menu-ico{background:var(--accent-soft)}
  .l-longo{display:none}
  .l-curto{display:block}
  .menu-ajuda{display:none}
  .ajuda-m{display:block}
  body.logado .wrap{padding-bottom:110px}
}

/* Tipografia das páginas */
.pag-head{display:grid;gap:8px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.h1{font-family:var(--font-brand);font-weight:600;font-size:34px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h1:focus{outline:none}
.h2{font-size:19px;font-weight:800;margin:0;text-wrap:balance}
.desc{margin:0;color:var(--muted);font-size:17px;max-width:62ch}
.bloco{display:grid;gap:14px}
.bloco-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.chips-info{display:flex;flex-wrap:wrap;gap:8px}
.chip-info{padding:5px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600}
.chip-info b{color:var(--accent)}
.vazio-txt{margin:0;color:var(--muted);padding:18px 20px;border:1px dashed var(--line);border-radius:12px}
.nota-previa{margin:0;font-size:14px;color:var(--muted);padding:10px 14px;border:1px dashed var(--line);border-radius:8px}
@media (max-width:560px){.h1{font-size:28px}.desc{font-size:16px}}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border:0;border-radius:6px;background:var(--cta);color:var(--on-brand);font-size:17px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--cta-hover)}
.btn:disabled{opacity:.6;cursor:progress}
.btn-cheio{width:100%}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1.5px solid var(--brand);border-radius:6px;background:var(--bg);color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-sec:hover{background:var(--accent-soft)}
.btn-wa{background:var(--wa)}
.btn-wa:hover{background:var(--wa-hover)}
.btn-voltar{background:none;border:0;padding:10px 0;color:var(--muted);font-weight:700;cursor:pointer}
.btn-voltar:hover{color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* Campos */
.campos{display:grid;gap:22px}
.campo{display:grid;gap:8px;min-width:0}
.lbl{font-weight:700;font-size:16px}
.input{width:100%;height:48px;border:1px solid var(--line);border-radius:6px;padding:0 14px;background:var(--bg);color:var(--ink);font-size:16px}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--off)}
.area{height:auto;min-height:92px;padding:12px 14px;resize:vertical;line-height:1.5}
.phone{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.phone:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.phone .input{border:0;border-radius:0;box-shadow:none;flex:1;min-width:0}
.ddi{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--soft);border-right:1px solid var(--line);font-weight:700;font-size:15px}
.is-erro .input,.is-erro .phone,.is-erro .unid{border-color:var(--error)}
.q-erro{margin:0;color:var(--error);font-size:14px;font-weight:600}
.q-ajuda{margin:0;font-size:14px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.linha-form{display:flex;gap:10px;flex-wrap:wrap}
.linha-form .input{flex:1 1 220px;width:auto}

/* Perguntas */
.perguntas{display:grid}
.q{display:grid;gap:12px;padding-block:22px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:4px}
.q-head{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;align-items:baseline}
.q-num{font-size:14px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.q-txt{font-size:18px;font-weight:700;line-height:1.4}
.q-txt small{font-weight:400;color:var(--muted);font-size:15px}
.q-head .q-ajuda{grid-column:2}
.q-corpo{padding-left:44px;display:grid;gap:10px}
@media (max-width:560px){.q-corpo{padding-left:0}.q-txt{font-size:17px}}
.opcoes{display:flex;flex-wrap:wrap;gap:10px}
.pill{position:relative}
.pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 18px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;background:var(--bg)}
.pill:hover span{border-color:var(--brand)}
.pill input[type="radio"]:checked + span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill input[type="checkbox"]:checked + span{background:var(--accent-soft);border-color:var(--brand);color:var(--accent)}
.pill input[type="checkbox"]:checked + span::before{content:"";width:6px;height:11px;border:solid currentColor;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-2px)}
.pill input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
.escala{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:400px}
.escala .pill span{width:100%;justify-content:center;border-radius:10px;font-size:18px;font-weight:800;padding-inline:0}
.escala-rot{display:flex;justify-content:space-between;gap:12px;max-width:400px;font-size:13px;color:var(--muted)}
.unid{display:flex;max-width:200px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.unid:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.unid .input{border:0;border-radius:0;box-shadow:none;flex:1;min-width:0}
.unid span{display:grid;place-items:center;padding:0 14px;background:var(--soft);color:var(--muted);font-weight:700;border-left:1px solid var(--line)}
.medidas{display:flex;flex-wrap:wrap;gap:16px 20px}
.medida{display:grid;gap:6px}
.medida .unid{width:180px}
.detalhe{display:grid;gap:6px;max-width:520px}
.lbl-det{font-weight:700;font-size:15px}
.area-curta{min-height:64px}
.q-nota{margin:0;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px;max-width:520px}

/* Assistente da ficha */
.prog{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.wiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-weight:700}
.barra{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));background:var(--bg);border-top:1px solid var(--line)}
@media (max-width:899px){body.logado .barra{bottom:calc(64px + env(safe-area-inset-bottom, 0px))}}
.partes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.partes li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:10px;background:var(--soft);font-weight:600}
.partes li span{color:var(--muted);font-weight:400}

/* Revisão */
.rev{display:grid;gap:12px;padding-top:20px;border-top:1px solid var(--line)}
.rev:first-child{border-top:0;padding-top:0}
.rev-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rev-top h2{font-family:var(--font-brand);font-size:22px;font-weight:600;margin:0}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px 24px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.vazio{color:var(--off);font-weight:400}
@media (max-width:600px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:12px}}

/* Início */
.tarefas{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px}
.tarefa{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:16px 18px}
.tarefa + .tarefa{border-top:1px solid var(--line)}
.t-ico{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--brand)}
.tarefa.is-feito .t-ico{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tarefa.is-pend .t-ico{border-color:var(--brand);border-style:dashed}
.t-txt strong{display:block;font-size:17px}
.t-txt span{color:var(--muted);font-size:15px}
@media (max-width:560px){.tarefa{grid-template-columns:34px minmax(0,1fr)}.t-acao{grid-column:2;justify-self:start;margin-top:6px}}

/* Documentos e exames */
.docs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.doc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.doc-ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.04em}
.doc strong{display:block;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--muted)}
.doc-nota{grid-column:2 / -1;margin:0;font-size:14px;color:var(--muted)}
@media (max-width:480px){.doc{grid-template-columns:44px minmax(0,1fr)}.doc .btn-sec{grid-column:2;justify-self:start}}
.drop{display:grid;justify-items:center;gap:8px;padding:32px 20px;border:2px dashed var(--line);border-radius:16px;text-align:center;cursor:pointer}
.drop:hover,.drop.is-over{border-color:var(--brand);background:var(--accent-soft)}
.drop:focus-within .btn-sec{outline:2px solid var(--brand);outline-offset:2px}
.drop-ico{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center}
.drop strong{font-size:18px}
.drop p{margin:0;color:var(--muted);font-size:14px}
.arquivos{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.arq{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.arq-nome{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arq-x{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.arq-x:hover{background:var(--error-soft);color:var(--error)}
.arq-desc{grid-column:2 / -1;height:42px;font-size:15px}
.arq-status{grid-column:2 / -1;margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.arq.is-ok .arq-status{color:var(--accent)}
.arq.is-erro .arq-status{color:var(--error)}
@media (max-width:480px){.arq-desc{grid-column:1 / -1}.arq-status{grid-column:1 / -1}}

/* Linha do tempo */
.tempo{list-style:none;margin:0;padding:0;display:grid}
.ev{display:grid;grid-template-columns:78px 18px minmax(0,1fr);gap:0 12px;padding-bottom:22px}
.ev-data{font-size:14px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ev-linha{position:relative;display:flex;justify-content:center}
.ev-linha::before{content:"";position:absolute;top:8px;bottom:-22px;width:2px;background:var(--line)}
.ev:last-child .ev-linha::before{display:none}
.ev-ponto{position:relative;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--brand);margin-top:4px}
.ev.is-nutri .ev-ponto{background:var(--brand)}
.ev-txt strong{display:block;font-weight:700}
.ev-txt span{font-size:14px;color:var(--muted)}

/* Cartões e avisos */
.cartao{border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;gap:14px}
.cartao.is-destaque{background:var(--soft);border-color:transparent}
.consulta-card{gap:6px}
.consulta-card .linha-form{margin-top:8px}
.consulta-quando{font-family:var(--font-brand);font-size:26px;font-weight:600;line-height:1.2}
.aviso{display:grid;gap:10px;padding:14px 16px;border-radius:10px;background:var(--error-soft);border:1px solid var(--error);font-size:15px}
.aviso p{margin:0}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);background:var(--ink);color:var(--on-brand);padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100vw - 32px);text-align:center}
@media (max-width:899px){body.logado .toast{bottom:calc(env(safe-area-inset-bottom, 0px) + 84px)}}

/* Acesso */
.acesso{display:grid;justify-items:center;padding-block:16px}
.acesso-card{width:100%;max-width:480px;display:grid;gap:22px}
.sigilo{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px;color:var(--muted)}
.ok-msg{margin:0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px}
.carregando{display:grid;justify-items:center;gap:14px;padding-block:80px;color:var(--muted);font-weight:700}
.roda{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.roda{animation:none}}

/* Rodapé */
.rodape{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.rodape-in{max-width:1120px;margin:0 auto;padding-block:22px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
@media (max-width:899px){body.logado .rodape{display:none}}
</style>
<!-- corpo -->
<header class="topo">
  <div class="topo-in">
    <a class="logo" href="#inicio" aria-label="Ana Carolina Pereira, área do paciente">
      <span class="logo-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 18.5C5.5 10.5 10.5 5 19 5c0 8.5-5.5 13.5-13.5 13.5z"/><path d="M5.5 18.5c2.6-3.6 5.6-6.1 9.2-8.2"/></svg>
      </span>
      <span class="logo-txt">
        <span class="logo-nome">Ana Carolina Pereira</span>
        <span class="logo-sub">Área do paciente</span>
      </span>
    </a>
    <div class="topo-user" id="topo-user" hidden>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="topo-nome" id="topo-nome"></span>
      <button type="button" class="topo-sair" data-acao="sair">Sair</button>
    </div>
  </div>

  function entrar() {

    if (!$("#e-aceite").checked) m.aceite = "Marque a autorização para continuar.";

    var m = String(c || "").match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);

    var quando = dia.charAt(0).toUpperCase() + dia.slice(1) + ", às " + Number(m[4]) + "h" + (m[5] !== "00" ? m[5] : "");
    var end = "Av. Nossa Senhora de Copacabana, 540, sala 1105";
    var online = mod === "Online";
    return '<section class="cartao is-destaque consulta-card" aria-labelledby="t-consulta"><span class="eyebrow" id="t-consulta">Sua próxima consulta' + (online ? " · online" : "") + "</span>" +

      '<div class="linha-form">' + (online ? (meet ? '<a class="btn" href="' + esc(meet) + '" target="_blank" rel="noopener">Entrar na consulta</a>' : "") : '<a class="btn-sec" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(end + ", Copacabana, Rio de Janeiro - RJ") + '" target="_blank" rel="noopener">Ver no mapa</a>') +

      return '<li class="arq' + (a.estado ? " is-" + a.estado : "") + '"><span class="doc-ico" aria-hidden="true">' + ext + '</span><div style="min-width:0"><span class="arq-nome">' + esc(a.nome) + '</span><span class="meta">' + tamanho(a.tamanho) + "</span></div>" +
        (a.estado === "indo" ? "<span></span>" : '<button type="button" class="arq-x" data-acao="remover" data-id="' + a.id + '" aria-label="Remover ' + esc(a.nome) + '">' + I.x + "</button>") +
        '<input class="input arq-desc" data-arq-desc="' + a.id + '" value="' + esc(a.descricao) + '" placeholder="Que exame é este? Ex.: hemograma, glicemia" aria-label="Que exame é ' + esc(a.nome) + '?"' + (a.estado === "indo" ? " disabled" : "") + ">" +
        (st ? '<p class="arq-status" role="status">' + esc(st) + "</p>" : "") + "</li>";
    }).join("");
  }
  function htmlAcaoEnvio() {
    var n = S.novos.filter(function (a) { return a.estado !== "ok"; }).length;
    if (!n) return "";
    return '<button type="button" class="btn" data-acao="enviar-exames"' + (S.enviandoExames ? " disabled" : "") + ">" + (S.enviandoExames ? "Enviando…" : "Enviar " + (n === 1 ? "1 exame" : n + " exames")) + "</button>";
  }
  function atualizarNovos() { var u = $("#novos"); if (u) u.innerHTML = htmlNovos(); var a = $("#acao-envio"); if (a) a.innerHTML = htmlAcaoEnvio(); }
  function adicionarArquivos(lista) {
    var erros = [];
    Array.prototype.forEach.call(lista, function (f) {
      var t = tipoDoArquivo(f);
      if (S.novos.length >= CONFIG.maxArquivosPorVez) { erros.push("Envie no máximo " + CONFIG.maxArquivosPorVez + " arquivos de cada vez."); return; }
      if (TIPOS_OK.indexOf(t) < 0) { erros.push(f.name + ": envie só PDF ou foto."); return; }
      if (f.size > CONFIG.maxArquivoMB * 1048576) { erros.push(f.name + ": passa de " + CONFIG.maxArquivoMB + " MB."); return; }
      if (S.novos.some(function (a) { return a.nome === f.name && a.tamanho === f.size; })) return;
      S.novos.push({ id: ++seq, file: f, nome: f.name, tamanho: f.size, tipo: t, descricao: "", estado: "" });
    });
    var e = $("#err-arq");
    if (e) { e.textContent = erros.filter(function (x, i) { return erros.indexOf(x) === i; }).join(" "); e.hidden = !erros.length; }
    atualizarNovos();
  }
  function ligarExames() {
    var drop = $("#drop");
    if (!drop) return;
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("is-over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("is-over"); }); });
    drop.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files) adicionarArquivos(e.dataTransfer.files); });
    drop.addEventListener("click", function (e) { if (e.target.closest("label, input")) return; $("#arq-input").click(); });
  }
  function lerBase64(f) {
    return new Promise(function (ok, falha) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { falha(r.error); };
      r.readAsDataURL(f);
    });
  }
  async function enviarExames() {
    if (S.enviandoExames) return;
    S.enviandoExames = true;
    var fila = S.novos.filter(function (a) { return a.estado !== "ok"; });
    for (var i = 0; i < fila.length; i++) {
      var a = fila[i];
      a.estado = "indo"; atualizarNovos();
      var r;
      try {
        var b64 = CONFIG.api ? await lerBase64(a.file) : "";
        r = await chamar("arquivo", { sessao: S.sessao, nome: a.nome, tipo: a.tipo, descricao: a.descricao.trim(), base64: b64 });
      } catch (e) { r = { ok: false, erro: "rede" }; }
      if (r.ok) {
        a.estado = "ok";
        if (CONFIG.api) S.P.exames.push(r.exame || { data: hojeISO(), nome: a.nome, descricao: a.descricao.trim() });
        else S.P.exames = DEMO.exames.slice();
      } else {
        if (r.erro === "sessao_expirada") { S.enviandoExames = false; return sair(msgErro(r.erro)); }
        a.estado = "erro"; a.msg = msgErro(r.erro) + " Toque em Enviar para tentar de novo.";
      }
      atualizarNovos();
    }
    S.enviandoExames = false;
    var falhas = S.novos.filter(function (a) { return a.estado === "erro"; }).length;
    var ok = fila.length - falhas;
    S.novos = S.novos.filter(function (a) { return a.estado !== "ok"; });
    if (S.aba === "exames") renderPagina();
    if (ok) toast(ok === 1 ? "Exame enviado." : ok + " exames enviados.");
  }

  /* Da nutricionista */
  function htmlDocs(docs) {
    return '<ul class="docs">' + docs.map(function (d) {
      return '<li class="doc"><span class="doc-ico">' + I.folha + '</span><div><strong>' + esc(d.titulo) + '</strong><span class="meta">' + esc(d.tipo || "Documento") + " · " + dataBR(d.data) + '</span></div><button type="button" class="btn-sec" data-acao="doc-abrir" data-id="' + esc(d.id) + '">Abrir</button>' +
        (S.docAviso && S.docAviso.id === d.id ? '<p class="doc-nota" role="status">' + esc(S.docAviso.msg) + "</p>" : "") + "</li>";
    }).join("") + "</ul>";
  }
  function htmlNutri() {
    var docs = S.P.documentos.slice().sort(function (a, b) { return b.data < a.data ? -1 : 1; });
    return '<header class="pag-head"><span class="eyebrow">Da nutricionista</span><h1 class="h1" tabindex="-1">Seus planos e orientações</h1><p class="desc">Plano alimentar, lista de compras, receitas e pedidos de exame que a ' + esc(CONFIG.nomeCurto) + " separou para você.</p></header>" +
      (docs.length ? htmlDocs(docs) : '<p class="vazio-txt">Ainda não tem nada aqui. Depois da sua consulta, o seu plano alimentar aparece nesta página.</p>');
  }
  function abrirDoc(id, botao) {
    botao.disabled = true;
    chamar("documento", { sessao: S.sessao, id: id }).then(function (r) {
      botao.disabled = false;
      if (!r.ok) {
        if (r.erro === "sessao_expirada") return sair(msgErro(r.erro));
        S.docAviso = { id: id, msg: msgErro(r.erro) }; renderPagina(); return;
      }
      var bytes = atob(r.base64), arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: r.tipo || "application/pdf" }));
      var a = document.createElement("a");
      a.href = url; a.download = r.nome || "documento.pdf"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    });
  }

  /* Acompanhamento */
  function linhaDoTempo() {
    var P = S.P, ev = [];
    ev.push({ data: P.paciente.cadastro, t: "Cadastro feito na recepção", d: "" });
    if (P.ficha) ev.push({ data: P.ficha.data, t: "Ficha de saúde respondida", d: "" });
    var porDia = {};
    P.exames.forEach(function (e) { (porDia[e.data] = porDia[e.data] || []).push(e.descricao || e.nome); });
    Object.keys(porDia).forEach(function (d) { var l = porDia[d]; ev.push({ data: d, t: l.length === 1 ? "Exame enviado" : l.length + " exames enviados", d: l.join(", ") }); });
    P.documentos.forEach(function (d) { ev.push({ data: d.data, t: "A nutricionista enviou: " + d.titulo, d: d.tipo || "", nutri: true }); });
    P.checkins.forEach(function (c) { ev.push({ data: c.data, t: "Você contou como está", d: resumoCheckin(c.valores) }); });
    return ev.map(function (e, i) { e.i = i; return e; }).sort(function (a, b) { return a.data === b.data ? b.i - a.i : (a.data < b.data ? 1 : -1); });
  }
  function resumoCheckin(v) {
    var p = [];
    if (!vazio(v.peso_hoje)) p.push("Peso " + String(v.peso_hoje).replace(".", ",") + " kg");
    if (!vazio(v.sentiu)) p.push("Como se sentiu: " + v.sentiu + " de 5");
    if (!vazio(v.plano)) p.push(v.plano);
    return p.join(" · ");
  }
  function htmlTempo(evs) {
    if (!evs.length) return '<p class="vazio-txt">Nada por aqui ainda.</p>';
    return '<ol class="tempo">' + evs.map(function (e) {
      return '<li class="ev' + (e.nutri ? " is-nutri" : "") + '"><span class="ev-data">' + dataCurta(e.data) + '</span><span class="ev-linha"><i class="ev-ponto"></i></span><div class="ev-txt"><strong>' + esc(e.t) + "</strong>" + (e.d ? "<span>" + esc(e.d) + "</span>" : "") + "</div></li>";
    }).join("") + "</ol>";
  }
  function htmlAcomp() {
    var card;
    if (S.checkinAberto) {
      card = '<section class="cartao" data-form="checkin"><h2 class="h2">Como você está?</h2><div class="perguntas">' +
        CHECKIN.perguntas.map(function (q, i) { return htmlPergunta(q, i + 1, S.checkinVals); }).join("") +
        '</div><div id="aviso-checkin"></div><div class="linha-form" style="justify-content:space-between;align-items:center"><button type="button" class="btn-voltar" data-acao="checkin-cancelar">Cancelar</button><button type="button" class="btn" data-acao="checkin-enviar" id="btn-checkin">Enviar ' + I.seta + "</button></div></section>";
    } else {
      card = '<section class="cartao is-destaque"><h2 class="h2">Como você está?</h2><p class="q-ajuda" style="font-size:15px">Conte como foram os últimos dias: peso, disposição e como foi seguir o plano. Leva 1 minuto.</p><div><button type="button" class="btn" data-acao="checkin-abrir">Contar como estou</button></div></section>';
    }
    return '<header class="pag-head"><span class="eyebrow">Acompanhamento</span><h1 class="h1" tabindex="-1">Sua evolução</h1><p class="desc">Tudo o que aconteceu no seu acompanhamento, do mais recente para o mais antigo.</p></header>' +
      card + '<section class="bloco"><h2 class="h2">Linha do tempo</h2>' + htmlTempo(linhaDoTempo()) + "</section>";
  }
  function enviarCheckin() {
    var raiz = $('[data-form="checkin"]');
    if (!mostrarErros(errosSecao(CHECKIN, S.checkinVals), raiz)) return;
    var b = $("#btn-checkin"); b.disabled = true; b.textContent = "Enviando…";
    var vals = S.checkinVals;
    chamar("checkin", { sessao: S.sessao, valores: vals, respostas: respostasPara([CHECKIN], vals) }).then(function (r) {
      if (!r.ok) {
        if (r.erro === "sessao_expirada") return sair(msgErro(r.erro));
        b.disabled = false; b.innerHTML = "Enviar " + I.seta;
        $("#aviso-checkin").innerHTML = '<div class="aviso" role="alert"><p>' + esc(msgErro(r.erro)) + "</p></div>";
        return;
      }
      S.P.checkins.push({ data: r.data || hojeISO(), valores: vals });
      S.checkinAberto = false; S.checkinVals = {};
      renderPagina();
      toast("Obrigada! A nutricionista vai ver.");
    });
  }

  /* ===== Render geral ===== */
  function render() {
    var logado = S.tela === "portal";
    document.body.classList.toggle("logado", logado);
    $("#topo-user").hidden = !logado;
    if (logado) {
      var partes = S.P.paciente.nome.trim().split(" ");
      $("#avatar").textContent = (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : "")).toUpperCase();
      $("#topo-nome").textContent = partes[0];
    }
    var app = $("#app");
    if (S.tela === "entrada") app.innerHTML = htmlEntrada();
    else if (S.tela === "confirmar") app.innerHTML = htmlConfirmar();
    else if (S.tela === "carregando") app.innerHTML = '<div class="carregando" role="status"><span class="roda" aria-hidden="true"></span>Abrindo sua área…</div>';
    else if (S.tela === "erro") app.innerHTML = '<div class="acesso"><div class="acesso-card"><h1 class="h1" tabindex="-1">Não deu para abrir</h1><div class="aviso"><p>' + esc(S.erroMsg) + '</p></div><button type="button" class="btn" data-acao="recarregar">Tentar de novo</button></div></div>';
    else { app.innerHTML = '<div class="portal">' + htmlMenu() + '<div class="pagina" id="pagina"></div></div>'; renderPagina(); return; }
    var t = $("#app .h1");
    if (t) t.focus({ preventScroll: true });
  }

  var tToast;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(tToast); tToast = setTimeout(function () { t.hidden = true; }, 3500);
  }

  /* ===== Eventos ===== */
  function valsDe(el) {
    var f = el.closest("[data-form]");
    if (!f) return null;
    return f.dataset.form === "checkin" ? S.checkinVals : (S.wiz ? S.wiz.valores : null);
  }
  function aoMudar(e) {
    var el = e.target;
    if (el.id === "e-cel" && e.type === "input") { el.value = mascaraTel(el.value); limparErro("celular"); return; }
    if (el.id === "e-email" || el.id === "r-email") { limparErro("email"); return; }
    if (el.id === "e-aceite") { limparErro("aceite"); return; }
    if (el.id === "arq-input" && e.type === "change") { adicionarArquivos(el.files); el.value = ""; return; }
    if (el.dataset.arqDesc) { S.novos.forEach(function (a) { if (a.id === +el.dataset.arqDesc) a.descricao = el.value; }); return; }
    var vals = valsDe(el);
    if (!vals) return;
    if (el.dataset.qOutro) { vals[el.dataset.qOutro + "__outro"] = el.value; limparErro(el.dataset.qOutro); return; }
    if (el.dataset.qDetalhe) { vals[el.dataset.qDetalhe + "__detalhe"] = el.value; limparErro(el.dataset.qDetalhe); return; }
    if (el.dataset.medida) { vals[el.dataset.q] = el.value; limparErro(el.dataset.medida); return; }
    if (!el.dataset.q) return;
    var qid = el.dataset.q, q = acharQ(qid);
    if (el.type === "checkbox") {
      if (e.type !== "change") return;
      var caixas = $$('input[data-q="' + qid + '"]', el.closest("[data-form]"));
      if (q.exclusiva && el.checked) caixas.forEach(function (c) { if (c !== el && (el.value === q.exclusiva || c.value === q.exclusiva)) c.checked = false; });
      vals[qid] = caixas.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
    } else if (el.type === "radio") {
      if (!el.checked) return;
      vals[qid] = el.value;
    } else {
      vals[qid] = el.value;
    }
    if (q.outro) {
      var o = $("#q-" + qid + "-outro"), marcado = [].concat(vals[qid] || []).indexOf("__outro") >= 0;
      if (o) { o.hidden = !marcado; if (marcado && el.value === "__outro" && e.type === "change") o.focus(); }
    }
    if (q.detalhe) {
      var dt = $("#q-" + qid + "-det");
      if (dt) { dt.hidden = vals[qid] !== "Sim"; if (!dt.hidden && e.type === "change") $("textarea", dt).focus(); }
    }
    if (q.notaSe) $$('[data-nota="' + qid + '"]').forEach(function (n) { n.hidden = n.dataset.se !== vals[qid]; });
    limparErro(qid);
  }
  document.addEventListener("input", aoMudar);
  document.addEventListener("change", aoMudar);

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "form-entrar") entrar();
    else if (e.target.id === "form-reenviar") reenviar();
  });

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-acao]");
    if (!b) return;
    var a = b.dataset.acao;
    if (a === "sair") sair("");
    else if (a === "recarregar") carregarPortal();
    else if (a === "pedir-link") { S.tela = "entrada"; render(); }
    else if (a === "ficha-comecar") { S.wiz = { passo: 0, valores: {} }; renderPagina(); }
    else if (a === "ficha-editar") { S.wiz = { passo: 0, valores: JSON.parse(JSON.stringify(S.P.ficha.valores || {})) }; renderPagina(); }
    else if (a === "wiz-sair") { S.wiz = null; renderPagina(); }
    else if (a === "wiz-voltar") { if (S.wiz.passo === 0) { S.wiz = null; renderPagina(); } else wizIr(S.wiz.passo - 1); }
    else if (a === "wiz-avancar") wizAvancar();
    else if (a === "wiz-ir") wizIr(+b.dataset.passo);
    else if (a === "wiz-enviar") wizEnviar();
    else if (a === "remover") { S.novos = S.novos.filter(function (x) { return x.id !== +b.dataset.id; }); atualizarNovos(); }
    else if (a === "enviar-exames") enviarExames();
    else if (a === "doc-abrir") abrirDoc(b.dataset.id, b);
    else if (a === "checkin-abrir") { S.checkinAberto = true; renderPagina(); var c = $('[data-form="checkin"]'); if (c) c.scrollIntoView({ block: "start", behavior: reduz ? "auto" : "smooth" }); }
    else if (a === "checkin-cancelar") { S.checkinAberto = false; S.checkinVals = {}; renderPagina(); }
    else if (a === "checkin-enviar") enviarCheckin();
  });

  window.addEventListener("hashchange", function () {
    if (S.tela !== "portal") return;
    var nova = abaDoHash();
    if (nova === S.aba) return;
    S.aba = nova; S.docAviso = null;
    renderPagina();
    window.scrollTo({ top: 0 });
  });
  // Arquivo solto fora da área de envio não abre no navegador
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); });
  window.addEventListener("beforeunload", function (e) { if (S.enviandoExames) { e.preventDefault(); e.returnValue = ""; } });

  /* ===== Início ===== */
  (function iniciar() {
    var token = null;
    try { token = new URLSearchParams(location.search).get("p"); } catch (e) {}
    if (token) {
      guardar("nutri:token", token);
      try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    } else token = ler("nutri:token");
    S.token = token || (CONFIG.api ? null : "previa");
    var sess = ler("nutri:sessao");
    if (sess && sess.sessao) { S.sessao = sess.sessao; S.nome = sess.nome; carregarPortal(); return; }
    S.tela = S.token ? "confirmar" : "entrada";
    render();
  })();
})();
</script>
