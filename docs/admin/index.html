<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#5d6e35">

<title>Painel da Equipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Painel da nutricionista Ana Carolina Pereira e da recepção: cadastro e acompanhamento dos pacientes.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: faixa musgo no topo e, logo abaixo, abas fixas (Pacientes / Cadastrar). A lista de pacientes é uma tabela no computador e cartões no celular; a ficha do paciente tem o conteúdo de saúde à esquerda e os dados do cadastro numa coluna à direita. Tema único claro. */
:root{
  --bg:#ffffff;
  --ink:#2c2f26;
  --muted:#727667;
  --line:#e0e2d7;
  --soft:#f5f6f0;
  --brand:#5d6e35;
  --on-brand:#ffffff;
  --on-brand-line:rgba(255,255,255,.6);
  --accent:#56672f;
  --accent-soft:#eef1e3;
  --cta:#5d6e35;
  --cta-hover:#4a5928;
  --wa:#1f9a52;
  --wa-hover:#18833f;
  --error:#d4492f;
  --error-soft:#fcefeb;
  --off:#c0c3b4;
  --shadow:rgba(40,45,30,.22);
  --backdrop:rgba(30,32,25,.45);
  --error-hover:#b83c25;
  --st-novo:#85560a; --st-novo-bg:#fbefd9;
  --st-ficha:#2d5487; --st-ficha-bg:#e7eef8;
  --st-pausa:#66655e; --st-pausa-bg:#efeee9;
  --font-ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-brand:"Fraunces",Georgia,"Times New Roman",serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:25;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{flex:none}

/* Topo */
.topo{background:var(--brand);color:var(--on-brand)}
.topo-in{max-width:1180px;margin:0 auto;padding-block:14px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.logo-mark{width:40px;height:40px;border-radius:11px;border:2px solid currentColor;display:grid;place-items:center}
.logo-txt{display:grid;line-height:1.15;min-width:0}
.logo-nome{font-family:var(--font-brand);font-size:21px;font-weight:600}
.logo-sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.topo-user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--on-brand);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px}
.topo-nome{font-weight:700}
.topo-sair{background:none;border:1.5px solid var(--on-brand-line);color:var(--on-brand);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer}
@media (max-width:560px){.topo-nome{display:none}.logo-nome{font-size:18px}}

/* Abas */
.abas{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.abas-in{max-width:1180px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;gap:4px;overflow-x:auto}
.aba{display:flex;align-items:center;gap:8px;padding:14px 14px 12px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.aba:hover{color:var(--ink)}
.aba[aria-current="page"]{color:var(--accent);border-bottom-color:var(--brand)}

/* Estrutura e tipografia */
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:grid;gap:24px}
.head-linha{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.pag-head{display:grid;gap:6px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.h1{font-family:var(--font-brand);font-weight:600;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.h1:focus{outline:none}
.h2{font-size:18px;font-weight:800;margin:0}
.desc{margin:0;color:var(--muted);font-size:16px;max-width:62ch}
.muted{color:var(--muted)}
.nota-previa{margin:0;font-size:14px;color:var(--muted);padding:10px 14px;border:1px dashed var(--line);border-radius:8px}
@media (max-width:560px){.h1{font-size:27px}}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border:0;border-radius:6px;background:var(--cta);color:var(--on-brand);font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--cta-hover)}
.btn:disabled{opacity:.6;cursor:progress}
.btn-cheio{width:100%}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border:1.5px solid var(--brand);border-radius:6px;background:var(--bg);color:var(--accent);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-sec:hover{background:var(--accent-soft)}
.btn-sec:disabled{opacity:.6;cursor:progress}
.btn-wa{border-color:var(--wa);color:var(--wa)}
.btn-wa-cheio{background:var(--wa)}
.btn-wa-cheio:hover{background:var(--wa-hover)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.voltar{color:var(--muted);font-weight:700;text-decoration:none}
.voltar:hover{color:var(--accent)}
.campos{display:grid;gap:18px}
.duas{display:grid;gap:18px}
@media (min-width:640px){.duas{grid-template-columns:1fr 1fr}}
.campo{display:grid;gap:7px;min-width:0}
fieldset.grupo-consulta{border:0;margin:0;padding:0;display:grid;gap:8px}
fieldset.grupo-consulta legend{padding:0;margin-bottom:2px}
.tag-online{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--st-ficha-bg);color:var(--st-ficha);font-size:12px;font-weight:800}
.lbl{font-weight:700;font-size:15px}
.input,.select{width:100%;height:46px;border:1px solid var(--line);border-radius:6px;padding:0 14px;background:var(--bg);color:var(--ink);font-size:16px}
.input:focus,.select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--off)}
.area{height:auto;min-height:120px;padding:12px 14px;resize:vertical;line-height:1.5}
.phone{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.phone:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.phone .input{border:0;border-radius:0;box-shadow:none;flex:1;min-width:0}
.ddi{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--soft);border-right:1px solid var(--line);font-weight:700;font-size:15px}
.is-erro .input,.is-erro .phone,.is-erro .select{border-color:var(--error)}
.q-erro{margin:0;color:var(--error);font-size:14px;font-weight:600}
.ok-msg{margin:0;color:var(--accent);font-size:14px;font-weight:700}
.aviso{margin:0;padding:12px 14px;border-radius:10px;background:var(--error-soft);border:1px solid var(--error);font-size:15px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pill span{display:grid;gap:2px;height:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px}
.pill span b{font-weight:800}
.pill span small{color:var(--muted);font-size:13px}
.pill input:checked + span{border-color:var(--brand);background:var(--accent-soft)}
.pill input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}

/* Login */
.acesso{display:grid;justify-items:center;padding-block:24px}
.acesso-card{width:100%;max-width:460px;display:grid;gap:22px}
.senha{display:flex;gap:8px}
.senha .input{flex:1;min-width:0}

/* Filtros e lista */
.filtros{display:grid;gap:12px}
.filtros-linha{display:flex;gap:12px;flex-wrap:wrap}
.busca{flex:1 1 280px;position:relative}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.busca .input{padding-left:42px}
.filtros .select{flex:0 1 280px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-f{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.chip-f b{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.chip-f:hover{border-color:var(--brand)}
.chip-f[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip-f[aria-pressed="true"] b{color:var(--on-brand-line)}
.tabela-wrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:12px 16px;background:var(--soft);white-space:nowrap}
td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.linha{cursor:pointer}
tr.linha:hover td{background:var(--soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{min-width:240px}
.p-nome{font-weight:800;color:var(--ink);text-decoration:none}
.p-nome:hover{text-decoration:underline}
.p-sub{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.st-novo{background:var(--st-novo-bg);color:var(--st-novo)}
.st-ficha{background:var(--st-ficha-bg);color:var(--st-ficha)}
.st-acomp{background:var(--accent-soft);color:var(--accent)}
.st-pausa{background:var(--st-pausa-bg);color:var(--st-pausa)}
.st-alta{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.obj{font-weight:600}
.obj-vazio{color:var(--off)}
.novo{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;vertical-align:1px}
.cartoes{display:none;list-style:none;margin:0;padding:0;gap:10px}
.cartao-p{display:grid;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
.cartao-p:hover{background:var(--soft)}
.cartao-p .linha1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cartao-p .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
@media (max-width:859px){.tabela-wrap{display:none}.cartoes{display:grid}}
.vazio-txt{margin:0;color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:12px;text-align:center}

/* Paciente */
.det{display:grid;gap:28px}
@media (min-width:980px){.det{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.det-head{display:grid;gap:10px}
.det-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-i{padding:3px 11px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:700}
.det-acoes{display:flex;gap:10px;flex-wrap:wrap}
.principal{display:grid;gap:0;min-width:0}
.secao{display:grid;gap:14px;padding-block:24px;border-top:1px solid var(--line)}
.secao:first-child{border-top:0;padding-top:0}
.secao-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lado{display:grid;gap:16px;min-width:0}
@media (min-width:980px){.lado{position:sticky;top:72px}}
.cartao{border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:14px}
.cartao.is-destaque{background:var(--soft);border-color:transparent}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 24px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:700;overflow-wrap:anywhere;white-space:pre-line}
.sim{color:var(--accent)}
@media (max-width:600px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:10px}}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.item-ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.04em}
.item strong{display:block;overflow-wrap:anywhere}
.item .meta{font-size:14px;color:var(--muted)}
.item-nota{grid-column:2 / -1;margin:0;font-size:14px;color:var(--muted)}
@media (max-width:480px){.item{grid-template-columns:44px minmax(0,1fr)}.item .btn-sec{grid-column:2;justify-self:start}}
.pesos{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pesos li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:10px 16px;align-items:baseline;font-variant-numeric:tabular-nums}
.pesos li + li{border-top:1px solid var(--line)}
.pesos .d{color:var(--muted);font-size:14px;font-weight:700}
.pesos .v{font-weight:800}
.pesos .dif{font-size:14px;font-weight:700;color:var(--muted)}
.pesos .dif.desce{color:var(--accent)}
.checkin{display:grid;gap:10px;padding:14px 16px;border-radius:12px;background:var(--soft)}
.checkin .d{font-weight:800}
.resumo-peso{margin:0;font-weight:700}

/* Menu dos três pontinhos e confirmação */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}
th.col-mais,td.col-mais{width:56px;padding-left:0;padding-right:10px;text-align:right}
.mais{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.mais:hover,.mais[aria-expanded="true"]{background:var(--soft);color:var(--ink)}
.pop{position:fixed;z-index:50;min-width:210px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px var(--shadow);padding:6px;display:grid}
.pop button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:8px;background:none;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
.pop button:hover,.pop button:focus-visible{background:var(--soft)}
.pop .perigo{color:var(--error)}
.pop .perigo:hover,.pop .perigo:focus-visible{background:var(--error-soft)}
.cartao-li{position:relative}
.cartao-li .mais{position:absolute;right:8px;bottom:8px}
.cartao-p .meta{padding-right:36px}
dialog.confirma{border:0;border-radius:16px;padding:24px;width:min(440px, calc(100vw - 32px));box-shadow:0 20px 60px var(--shadow);color:var(--ink);background:var(--bg)}
dialog.confirma::backdrop{background:var(--backdrop)}
.confirma h2{font-family:var(--font-brand);font-weight:600;font-size:24px;line-height:1.2;margin:0 0 10px;text-wrap:balance}
.confirma p{margin:0 0 10px;color:var(--muted)}
.confirma ul{margin:0 0 12px;padding-left:20px;display:grid;gap:2px}
.confirma .acoes{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-perigo{background:var(--error)}
.btn-perigo:hover{background:var(--error-hover)}
.link-perigo{color:var(--error)}

/* Agenda */
.agenda{display:grid;gap:14px}
.dia-ag{border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.dia-ag.is-hoje{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.dia-top{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.tag-modo{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.tag-modo.is-online{background:var(--st-ficha-bg);color:var(--st-ficha)}
.marcados{list-style:none;margin:0;padding:0;display:grid}
.marcado{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.marcado:first-child{border-top:0;padding-top:2px}
.m-hora{font-weight:800;font-variant-numeric:tabular-nums}
.m-acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.m-acoes .btn-sec{min-height:36px;padding:0 12px;font-size:14px}
@media (max-width:600px){.marcado{grid-template-columns:52px minmax(0,1fr)}.m-acoes{grid-column:2;justify-content:flex-start}}
.livres{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.livre{min-height:34px;padding:0 12px;border:1.5px dashed var(--line);border-radius:8px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer}
.livre:hover,.livre:focus-visible{border-style:solid;border-color:var(--brand);color:var(--accent);background:var(--accent-soft)}

/* Toast e carregando */
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);background:var(--ink);color:var(--on-brand);padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;max-width:calc(100vw - 32px);text-align:center}
.carregando{display:grid;justify-items:center;gap:14px;padding-block:72px;color:var(--muted);font-weight:700}
.roda{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.roda{animation:none}}
.sucesso{display:grid;gap:16px;justify-items:start;max-width:620px}
.ok{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <a class="logo" href="#pacientes" aria-label="Ana Carolina Pereira, painel da equipe">
      <span class="logo-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 18.5C5.5 10.5 10.5 5 19 5c0 8.5-5.5 13.5-13.5 13.5z"/><path d="M5.5 18.5c2.6-3.6 5.6-6.1 9.2-8.2"/></svg>
      </span>
      <span class="logo-txt">
        <span class="logo-nome">Ana Carolina Pereira</span>
        <span class="logo-sub">Painel da equipe</span>
      </span>
    </a>
    <div class="topo-user" id="topo-user" hidden>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="topo-nome" id="topo-nome"></span>
      <button type="button" class="topo-sair" data-acao="sair">Sair</button>
    </div>
  </div>
</header>
<nav class="abas" id="abas" aria-label="Seções do painel" hidden>

  function errosContato(v) {
    var m = {};
    if (!v.nome) m.nome = "Digite o nome completo.";
    else if (v.nome.split(" ").length < 2) m.nome = "Digite o nome e o sobrenome.";
    if (!v.email) m.email = "Digite o e-mail.";
    else if (!reEmail.test(v.email)) m.email = "Confira o e-mail. Ele deve ficar assim: nome@exemplo.com";
    var d = digitos(v.celular);
    if (!d) m.celular = "Digite o celular.";
    else if (d.length < 10) m.celular = "Digite o celular com DDD.";
    if (!v.nascimento) m.nascimento = "Preencha a data de nascimento.";
    else if (v.nascimento > hojeISO()) m.nascimento = "A data não pode ser no futuro.";
    return m;
  }
  function mostrarErros(m, raiz) {
    var primeiro = null;
    $$(".is-erro", raiz).forEach(function (b) { b.classList.remove("is-erro"); $(".q-erro", b).hidden = true; });
    Object.keys(m).forEach(function (k) {
      var b = $('[data-bloco="' + k + '"]', raiz);
      if (!b) return;
      b.classList.add("is-erro"); $(".q-erro", b).textContent = m[k]; $(".q-erro", b).hidden = false;
      if (!primeiro) primeiro = b;
    });

    return true;
  }
  function cadastrar() {

    var cons = lerConsulta("c"), m = errosContato(v);
    if (!cons.dia) m.consulta = "Escolha o dia da consulta.";
    else if (!cons.hora) m.consulta = "Escolha o horário da consulta.";

    var b = $("#btn-cad"); b.disabled = true; b.textContent = "Cadastrando…";
    $("#aviso-cad").innerHTML = "";
    chamar("cadastrar", { nome: v.nome, email: v.email, celular: digitos(v.celular), nascimento: v.nascimento, consulta: cons.valor, modalidade: cons.modalidade }).then(function (r) {
      if (seExpirou(r)) return;

        else if (r.erro === "horario_ocupado" || r.erro === "consulta_invalida") {
          mostrarErros({ consulta: msgErro(r.erro) }, form);
          chamar("adminPacientes").then(function (x) { if (x && x.ok) { S.lista = x.pacientes; atualizarHoras("c"); } });
        }

        return;
      }
      S.lista = null;
      S.cadastrado = { id: r.id, nome: v.nome, email: v.email, celular: v.celular, link: r.link || "", consulta: cons.valor, modalidade: cons.modalidade, meet: r.meet || "", aviso: r.aviso || "" };
      renderCadastro();

  }

  function pesos(d) {

    if (d.ficha) { var pf = achar(d.ficha.respostas, /Peso:\s*([\d.,]+)\s*kg/i); if (pf) out.push({ data: d.ficha.data, v: pf, origem: "Ficha" }); }

  }

    return t;
  }
  async function enviarDocumento() {
    var form = $("#form-doc"), titulo = $("#doc-titulo").value.trim(), f = $("#doc-arq").files[0], m = {};
    if (!titulo) m.titulo = "Dê um título, por exemplo: Plano alimentar - novembro.";
    if (!f) m.arquivo = "Escolha o arquivo.";
    else if (TIPOS_OK.indexOf(tipoDoArquivo(f)) < 0) m.arquivo = msgErro("tipo_invalido");
    else if (f.size > CONFIG.maxDocumentoMB * 1048576) m.arquivo = msgErro("arquivo_grande");
    if (!mostrarErros(m, form)) return;
    var b = $("#btn-doc"); b.disabled = true; b.textContent = "Enviando…";
    var r;
    try {
      r = await chamar("adminDocumento", { id: S.atual.paciente.id, titulo: titulo, tipoDoc: $("#doc-tipo").value, mime: tipoDoArquivo(f), base64: CONFIG.api ? await lerBase64(f) : "" });
    } catch (e) { r = { ok: false, erro: "rede" }; }
    if (seExpirou(r)) return;
    if (!r.ok) { b.disabled = false; b.textContent = "Enviar para a área do paciente"; $("#aviso-doc").innerHTML = '<p class="aviso" role="alert">' + esc(msgErro(r.erro)) + "</p>"; return; }
    S.atual.documentos.push(r.documento);
    if (S.atual.paciente.status === "Novo" || S.atual.paciente.status === "Ficha respondida") S.atual.paciente.status = "Em acompanhamento";
    S.lista = null;
    renderPaciente();
    toast("Enviado. Já aparece na área do paciente.");
  }
  function abrirArquivo(id, botao) {
    botao.disabled = true;
    chamar("adminArquivo", { id: id }).then(function (r) {
      botao.disabled = false;
      if (seExpirou(r)) return;
      if (!r.ok) { S.arqAviso = { id: id, msg: msgErro(r.erro) }; renderPaciente(); return; }
      var bytes = atob(r.base64), arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: r.tipo || "application/pdf" }));
      var a = document.createElement("a"); a.href = url; a.download = r.nome || "arquivo"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    });
  }

  /* ===== Remover paciente ===== */
  var menuBtn = null;
  function botaoMais(p) {
    return '<button type="button" class="mais" data-acao="menu" data-id="' + esc(p.id) + '" aria-haspopup="menu" aria-expanded="false" aria-label="Mais opções para ' + esc(p.nome) + '">' + I.pontos + "</button>";
  }
  function abrirMenu(btn) {
    if (menuBtn === btn) { fecharMenu(); return; }
    fecharMenu();
    var pop = $("#pop"), id = btn.dataset.id;
    pop.innerHTML = '<button type="button" role="menuitem" data-acao="abrir-p" data-id="' + esc(id) + '">Abrir paciente</button>' +
      '<button type="button" role="menuitem" class="perigo" data-acao="pedir-remover" data-id="' + esc(id) + '">' + I.lixo + " Remover paciente</button>";
    pop.hidden = false;
    var r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + "px";
    pop.style.top = Math.max(8, top) + "px";
    btn.setAttribute("aria-expanded", "true");
    menuBtn = btn;
    $("button", pop).focus();
  }
  function fecharMenu() {
    var pop = $("#pop");
    if (pop.hidden) return;
    pop.hidden = true;
    if (menuBtn) menuBtn.setAttribute("aria-expanded", "false");
    menuBtn = null;
  }
  function pedirRemover(id) {
    fecharMenu();
    var p = (S.lista || []).filter(function (x) { return x.id === id; })[0];
    if (!p && S.atual && S.atual.paciente.id === id) {
      var a = S.atual;
      p = { id: id, nome: a.paciente.nome, ficha: a.ficha ? a.ficha.data : "", exames: a.exames ? a.exames.length : null, checkins: a.checkins ? a.checkins.length : 0 };
    }
    if (!p) return;
    var itens = ["o cadastro e o link de acesso"];
    if (p.ficha) itens.push("a ficha de saúde" + (p.checkins ? ' e os registros de "como estou"' : ""));
    if (p.exames) itens.push(p.exames + (p.exames === 1 ? " exame" : " exames") + " e os documentos enviados");
    else itens.push("os exames e documentos, se tiver");
    var dlg = $("#dlg-remover");
    dlg.innerHTML = '<h2 id="dlg-titulo">Remover ' + esc(p.nome) + "?</h2><p>Isso apaga da planilha:</p><ul>" + itens.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" +
      "<p>A pasta no Google Drive vai para a lixeira, onde fica 30 dias. Paciente que terminou o acompanhamento não precisa ser removido: use a situação Alta.</p>" +
      '<p class="q-erro" id="dlg-erro" hidden></p><div class="acoes"><button type="button" class="btn-sec" data-acao="cancelar-remover">Cancelar</button><button type="button" class="btn btn-perigo" data-acao="confirmar-remover" data-id="' + esc(p.id) + '" data-nome="' + esc(p.nome) + '">Remover paciente</button></div>';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    $('[data-acao="cancelar-remover"]', dlg).focus();
  }
  function fecharDialogo() { var dlg = $("#dlg-remover"); if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  function remover(b) {
    var id = b.dataset.id, nome = b.dataset.nome;
    b.disabled = true; b.textContent = "Removendo…";
    chamar("adminRemover", { id: id }).then(function (r) {
      if (seExpirou(r)) { fecharDialogo(); return; }
      if (!r.ok) {
        b.disabled = false; b.textContent = "Remover paciente";
        var e = $("#dlg-erro"); e.textContent = msgErro(r.erro); e.hidden = false;
        return;
      }
      fecharDialogo();
      if (S.lista) S.lista = S.lista.filter(function (x) { return x.id !== id; });
      toast("Cadastro de " + nome.split(" ")[0] + " removido.");
      if (location.hash === "#p-" + id) location.hash = "#pacientes";
      else if (S.lista) renderLista();
    });
  }

  var tToast;
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tToast); tToast = setTimeout(function () { t.hidden = true; }, 3500); }

  /* ===== Eventos ===== */
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === "form-login") entrar();
    else if (id === "form-cad") cadastrar();
    else if (id === "form-edit") salvarEdicao();
    else if (id === "form-doc") enviarDocumento();
  });
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "c-cel" || el.id === "e-cel") el.value = mascaraTel(el.value);
    if (el.id === "f-busca") { S.filtro.busca = el.value; renderResultado(); }
    var b = el.closest("[data-bloco]");
    if (b && b.classList.contains("is-erro")) { b.classList.remove("is-erro"); $(".q-erro", b).hidden = true; }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "f-objetivo") { S.filtro.objetivo = e.target.value; renderResultado(); }
    if (e.target.dataset.consulta) atualizarHoras(e.target.dataset.consulta);
    if (e.target.dataset.modo) trocarModo(e.target.dataset.modo);
    var bc = e.target.closest('[data-bloco="consulta"]');
    if (bc && bc.classList.contains("is-erro")) { bc.classList.remove("is-erro"); $(".q-erro", bc).hidden = true; }
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#pop") && !e.target.closest(".mais")) fecharMenu();
    var fa = e.target.closest("[data-agenda-filtro]");
    if (fa) { S.agendaFiltro = fa.dataset.agendaFiltro; renderAgenda(); return; }
    var chip = e.target.closest(".chip-f");
    if (chip) { S.filtro.status = chip.dataset.status; renderChips(); renderResultado(); return; }
    var linha = e.target.closest("tr.linha");
    if (linha && !e.target.closest("a, button")) { location.hash = linha.dataset.ir; return; }
    var b = e.target.closest("[data-acao]");
    if (!b) return;
    var a = b.dataset.acao;
    if (a === "sair") sair("");
    else if (a === "recarregar") rota();
    else if (a === "ver-senha") { var s = $("#l-senha"); s.type = s.type === "password" ? "text" : "password"; b.textContent = s.type === "password" ? "Mostrar" : "Esconder"; }
    else if (a === "limpar-filtros") { S.filtro = { busca: "", status: "Todos", objetivo: "" }; renderLista(); }
    else if (a === "cadastrar-outro") { S.cadastrado = null; renderCadastro(); }
    else if (a === "editar") { S.editando = true; renderPaciente(); }
    else if (a === "cancelar-edicao") { S.editando = false; renderPaciente(); }
    else if (a === "salvar-acomp") {
      var campos = { status: $("#a-status").value }, ca = lerConsulta("a");
      if ($("#a-objetivo")) campos.objetivo = $("#a-objetivo").value;
      if (ca.dia && !ca.hora) { mostrarErros({ consulta: "Escolha o horário da consulta." }, $(".lado")); return; }
      campos.consulta = ca.valor;
      campos.modalidade = ca.valor ? ca.modalidade : "";
      atualizar(campos, $("#ok-acomp"), b).then(function (r) {
        if (r && r.ok) {
          if (r.meet !== undefined) S.atual.paciente.meet = r.meet;
          renderPaciente();
          toast(r.aviso === "agenda" ? "Salvo, mas a consulta não entrou na Google Agenda. Veja o LEIA-ME." : "Acompanhamento salvo.");
        }
        else if (r && (r.erro === "horario_ocupado" || r.erro === "consulta_invalida")) mostrarErros({ consulta: msgErro(r.erro) }, $(".lado"));
      });
    }
    else if (a === "salvar-anotacoes") atualizar({ anotacoes: $("#anotacoes").value }, $("#ok-anot"), b);
    else if (a === "reenviar") {
      b.disabled = true;
      chamar("adminReenviar", { id: S.atual.paciente.id }).then(function (r) {
        b.disabled = false;
        if (seExpirou(r)) return;
        toast(r.ok ? "E-mail reenviado para " + S.atual.paciente.email + "." : msgErro(r.erro));
      });
    }
    else if (a === "abrir-arq") abrirArquivo(b.dataset.id, b);
    else if (a === "menu") abrirMenu(b);
    else if (a === "abrir-p") { fecharMenu(); location.hash = "#p-" + b.dataset.id; }
    else if (a === "pedir-remover") pedirRemover(b.dataset.id);
    else if (a === "cancelar-remover") fecharDialogo();
    else if (a === "confirmar-remover") remover(b);
    else if (a === "mais-semanas") { S.agendaSemanas += 4; renderAgenda(); }
    else if (a === "marcar-livre") { S.preCadastro = { consulta: b.dataset.dia + " " + b.dataset.hora, modalidade: b.dataset.modo }; location.hash = "#cadastrar"; }
  });

  /* ===== Início ===== */
  var s = ler();
  if (s && s.sessao) { S.sessao = s.sessao; S.por = s.por; S.veSaude = !!s.veSaude; rota(); }
  else sair("");
})();
</script>
</body>
</html>
